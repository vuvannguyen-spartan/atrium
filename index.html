<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="description"
    content="HTTrack is an easy-to-use website mirror utility. It allows you to download a website from the Internet to a local directory and browse it offline.">
  <meta name="keywords"
    content="httrack, website copier, offline browser, web mirror utility, website mirroring, web capture">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Index - HTTrack Website Copier</title>
  <style>
    body {
      margin: 0;
      padding: 8px 0 15px;
      background: #77b;
      font: 14px "Trebuchet MS", Verdana, Arial, Helvetica, sans-serif;
    }

    #subTitle {
      background: #000;
      color: #fff;
      padding: 4px;
      font-weight: bold;
    }

    #pageContent {
      clear: both;
      border-bottom: 6px solid #000;
      padding: 20px 10px;
      line-height: 1.65em;
      background: #ccd url('backblue.gif') no-repeat top right;
    }

    a {
      text-decoration: underline;
    }

    a:link {
      color: #00f;
    }

    a:visited {
      color: #000;
    }

    a:hover {
      color: #c00;
    }

    table {
      border-collapse: collapse;
      width: 76%;
      margin: 0 auto 15px;
    }

    .blak {
      background-color: #000;
    }

    .siteLink {
      background: url('fade.gif');
      padding: 6px;
    }

    h1 {
      text-align: center;
      font-size: 2em;
    }

    h6 {
      text-align: right;
      font-style: italic;
      margin: 20px 0 0;
    }

    #footer {
      text-align: center;
      padding: 10px;
      background: #ccd;
    }

    small {
      font-size: 0.85em;
    }
  </style>
</head>

<body>

  <table>
    <tr>
      <td id="subTitle">HTTrack Website Copier - Open Source offline browser</td>
    </tr>
  </table>

  <div id="pageContent">
    <h1>Index of locally available sites:</h1>
    <table>
      <tr>
        <td class="siteLink">
          &middot;
          <a href="www.plain.com/index.html">
            Plain – B2B support platform for Slack, MS Teams and Discord
          </a>
        </td>
      </tr>
    </table>

    <h6>Mirror and index made by HTTrack Website Copier</h6>
  </div>

  <div id="footer">
    <small>&copy; 2008 Xavier Roche & other contributors - Web Design: Leto Kauler.</small>
  </div>

  <meta http-equiv="refresh" content="0; URL=www.plain.com/index.html">

</body>

</html>
